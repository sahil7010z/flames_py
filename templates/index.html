<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FLAMES Game</title>
  <style>
    body {
      background: linear-gradient(to right, #ffe6e6, #ffe0f0);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    h1 {
      color: #e60073;
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: fadeInDown 1s ease;
    }

    form {
      margin-bottom: 2rem;
      animation: fadeInUp 1s ease;
    }

    input {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      margin: 0.5rem;
      border: 2px solid #e60073;
      border-radius: 10px;
      outline: none;
    }

    button {
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      background-color: #e60073;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #cc0066;
    }

    .result {
      margin-top: 2rem;
      font-size: 2rem;
      color: #e60073;
      font-weight: bold;
      animation: pop 1s ease;
      position: relative;
      display: inline-block;
      background-color: #fff0f5;
      padding: 1rem 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(230, 0, 115, 0.3);
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Floating emojis */
    .floating {
      position: absolute;
      animation: float 10s linear infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Footer credit */
    .footer-credit {
      position: absolute;
      bottom: 10px;
      width: 100%;
      font-size: 12px;
      color: black;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>FLAMES Game 💖</h1>
  <form method="post">
    <input type="text" name="name1" placeholder="Your Name" required />
    <input type="text" name="name2" placeholder="Crush's Name" required />
    <br />
    <button type="submit">Calculate</button>
  </form>

  {% if result %}
    <div class="result">
      🔥 Relationship Status: {{ result }} 🔥
    </div>
  {% endif %}

  <!-- Floating hearts and rose leaves -->
  <script>
    const emojis = ["💖", "🌹", "💘", "💕", "❤️"];
    const count = 20;

    for (let i = 0; i < count; i++) {
      const span = document.createElement("span");
      span.classList.add("floating");
      span.style.left = Math.random() * 100 + "vw";
      span.style.animationDuration = 5 + Math.random() * 5 + "s";
      span.style.fontSize = 20 + Math.random() * 20 + "px";
      span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      document.body.appendChild(span);
    }
  </script>

  <p class="footer-credit">
    Developed by: Sahil
  </p>
</body>
</html>
